<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pretend Fires</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   Arial, sans-serif;

      background:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        url("background.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      text-align: center;
      padding: 40px 24px;
      max-width: 700px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(48px, 8vw, 84px);
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .subtitle {
      font-size: 20px;
      margin-bottom: 40px;
    }

    .release {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    a {
      color: white;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Pretend Fires</h1>

    <div class="subtitle">
      New music project by John Steen in Austin, Texas
    </div>

    <div class="release">
      <strong>Die Alive</strong><br>
      Coming August 28
    </div>

    <div>
      <a href="mailto:info@pretendfires.com">info@pretendfires.com</a>
    </div>
  </main>
</body>
</html>
